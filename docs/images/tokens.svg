<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="書き込み用と読み取り用の PAT を、何に使い分けるかの対応">
  <style>
    .bg    { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .box   { fill: #ffffff; stroke: #d0d7de; }
    .w     { fill: #fff4e6; stroke: #d4881f; }
    .r     { fill: #eef4fd; stroke: #4a7fc1; }
    .t     { fill: #1f2328; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 13.5px; font-weight: 600; }
    .m     { fill: #1f2328; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
    .ms    { fill: #1f2328; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
    .dim   { fill: #656d76; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; }
    .hd    { fill: #656d76; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; font-weight: 600; }
    .no    { fill: #656d76; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 11.5px; }
    .arrow { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .box   { fill: #0d1117; stroke: #30363d; }
      .w     { fill: #2b2008; stroke: #d4881f; }
      .r     { fill: #0f1d2e; stroke: #4a7fc1; }
      .t, .m, .ms { fill: #e6edf3; }
      .dim, .hd, .no { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="t1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="340"/>

  <text class="hd" x="24" y="26">キーチェーンに 2 本。VM には環境変数で渡す</text>

  <rect class="w" x="16" y="42" width="404" height="72" rx="8"/>
  <text class="m"  x="34" y="66">github-token</text>
  <text class="no" x="34" y="86">Contents: RW / Issues: RW / Pull requests: RW / Metadata: R</text>
  <text class="no" x="34" y="104">対象は config.local.sh の REPOS 全部</text>

  <rect class="r" x="444" y="42" width="420" height="72" rx="8"/>
  <text class="m"  x="462" y="66">github-token-ro</text>
  <text class="no" x="462" y="86">Contents: R / Issues: R / Pull requests: R / Metadata: R</text>
  <text class="no" x="462" y="104">対象は読ませたい org のリポジトリ</text>

  <path class="arrow" d="M218,114 L218,142" marker-end="url(#t1)"/>
  <path class="arrow" d="M654,114 L654,142" marker-end="url(#t1)"/>

  <rect class="box" x="16" y="142" width="404" height="30" rx="6"/>
  <text class="ms" x="34" y="162">GITHUB_TOKEN</text>
  <rect class="box" x="444" y="142" width="420" height="30" rx="6"/>
  <text class="ms" x="462" y="162">GH_TOKEN_RO</text>

  <text class="hd" x="24" y="202">何に使うか</text>
  <rect class="panel" x="16" y="214" width="848" height="122" rx="8"/>

  <text class="m"   x="40" y="240">git push</text>
  <text class="dim" x="230" y="240">実装対象へのコミット。credential helper が GITHUB_TOKEN を読む</text>

  <text class="m"   x="40" y="264">gh pr create</text>
  <text class="dim" x="230" y="264">PR の作成、スクリーンショットや動画の添付、コメント、ラベル</text>

  <text class="m"   x="40" y="288">gh repo clone</text>
  <text class="dim" x="230" y="288">参照リポジトリ。repos.sh が GH_TOKEN_RO を明示して呼ぶ</text>

  <text class="m"   x="40" y="312">gh issue create</text>
  <text class="dim" x="230" y="312">実装対象に積み残しを起票する。参照リポジトリの議論は RO で読む</text>

</svg>
