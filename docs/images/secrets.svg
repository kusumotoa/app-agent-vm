<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 332" width="880" height="332" role="img" aria-label="シークレットがキーチェーンから共有フォルダを通って VM に渡り、止めると消える">
  <style>
    .bg    { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .box   { fill: #ffffff; stroke: #d0d7de; }
    .on    { fill: #ddf4e4; stroke: #4a9c68; }
    .t     { fill: #1f2328; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 14px; font-weight: 600; }
    .m     { fill: #1f2328; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
    .dim   { fill: #656d76; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; }
    .hd    { fill: #656d76; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; font-weight: 600; }
    .no    { fill: #656d76; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 11.5px; }
    .who   { fill: #4a9c68; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 11.5px; font-weight: 600; }
    .arrow { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .box   { fill: #0d1117; stroke: #30363d; }
      .on    { fill: #16301f; stroke: #4a9c68; }
      .t, .m { fill: #e6edf3; }
      .dim, .hd, .no { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="332"/>
  <text class="hd" x="24" y="26">シークレットが、キーチェーンから VM に渡って消えるまで</text>
  <rect class="panel" x="16" y="44" width="248" height="150" rx="6"/>
  <text class="hd" x="30" y="64">ホスト</text>
  <rect class="box" x="28" y="74" width="224" height="108" rx="6"/>
  <text class="t" x="40" y="96">キーチェーン</text>
  <text class="m" x="40" y="120">github-token</text>
  <text class="m" x="40" y="140">github-token-ro</text>
  <text class="m" x="40" y="160">github-packages-token</text>
  <rect class="panel" x="316" y="44" width="248" height="150" rx="6"/>
  <text class="hd" x="330" y="64">ホスト</text>
  <rect class="box" x="328" y="74" width="224" height="108" rx="6"/>
  <text class="t" x="340" y="96">共有フォルダ（.shared）</text>
  <text class="dim" x="340" y="120">読み取り専用</text>
  <text class="dim" x="340" y="140">start が動いている間だけ</text>
  <text class="dim" x="340" y="160">ディスクには残らない</text>
  <rect class="panel" x="616" y="44" width="248" height="150" rx="6"/>
  <text class="hd" x="630" y="64">VM</text>
  <rect class="on" x="628" y="74" width="224" height="108" rx="6"/>
  <text class="t" x="640" y="96">claude の環境</text>
  <text class="dim" x="640" y="120">GITHUB_TOKEN など</text>
  <text class="dim" x="640" y="140">secret.properties</text>
  <text class="dim" x="640" y="160">VM が止まると消える</text>
  <path class="arrow" d="M264,120 L316,120" marker-end="url(#a)"/>
  <path class="arrow" d="M564,120 L616,120" marker-end="url(#a)"/>
  <rect class="panel" x="16" y="214" width="848" height="98" rx="6"/>
  <text class="hd" x="30" y="234">Claude の認証は、ここを通らない</text>
  <text class="dim" x="30" y="258">ログインは VM の中の claude で行う。ホストのキーチェーンには入れない。</text>
  <text class="dim" x="30" y="278">VM のディスクに残るので、次の起動でもそのまま使える。</text>
  <text class="dim" x="30" y="298">コミットの署名鍵は、起動のたびに作って GitHub に登録し、止めるときに消す。</text>
</svg>
